<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How to use NudgeJudge: set up once, then every link from an app or the browser extension is routed by your rules</title>
  <style>
    .bg { fill: #EDF1EE; }
    .card { fill: #FFFFFF; stroke: #B4C1B9; }
    .ink { fill: #13201A; }
    .muted { fill: #4B5B52; }
    .faint { fill: #66766D; }
    .mono { font-family: 'Cascadia Mono', 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace; }
    .rule { stroke: #B4C1B9; }
    .track { stroke: #B4C1B9; }
    .trackFill { fill: #B4C1B9; }
    .route { stroke: #C97C06; }
    .routeFill { fill: #C97C06; }
    .ring { fill: #FFFFFF; stroke: #B4C1B9; }
    .panel { fill: #0F1F18; }
    .onPanel { fill: #E3EBE6; }
    .onPanelMuted { fill: #8DA89A; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0D1411; }
      .card { fill: #141E19; stroke: #3A4C42; }
      .ink { fill: #E3EBE6; }
      .muted { fill: #A2B3A9; }
      .faint { fill: #84978C; }
      .rule { stroke: #3A4C42; }
      .track { stroke: #3A4C42; }
      .trackFill { fill: #3A4C42; }
      .route { stroke: #F2B33D; }
      .routeFill { fill: #F2B33D; }
      .ring { fill: #141E19; stroke: #3A4C42; }
    }
  </style>
  <defs>
    <marker id="arrowRoute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path class="routeFill" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="arrowTrack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path class="trackFill" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="540" rx="16"/>

  <!-- ============ Set up once ============ -->
  <text class="ink" x="28" y="40" font-size="15" font-weight="600">Set up once</text>
  <text class="faint" x="122" y="40" font-size="12">Get started walks you through steps 1–3</text>

  <line class="track" x1="110" y1="88" x2="530" y2="88" stroke-width="4" stroke-linecap="round"/>
  <line class="track" x1="530" y1="88" x2="740" y2="88" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>

  <g text-anchor="middle">
    <circle class="ring" cx="110" cy="88" r="14" stroke-width="3"/>
    <text class="muted" x="110" y="93" font-size="13" font-weight="600">1</text>
    <text class="ink" x="110" y="128" font-size="13" font-weight="600">Find your browsers</text>
    <text class="faint" x="110" y="146" font-size="11">Get started scans what's installed</text>

    <circle class="ring" cx="320" cy="88" r="14" stroke-width="3"/>
    <text class="muted" x="320" y="93" font-size="13" font-weight="600">2</text>
    <text class="ink" x="320" y="128" font-size="13" font-weight="600">Add rules</text>
    <text class="faint" x="320" y="146" font-size="11">a pattern → a browser or profile</text>

    <circle class="ring" cx="530" cy="88" r="14" stroke-width="3"/>
    <text class="muted" x="530" y="93" font-size="13" font-weight="600">3</text>
    <text class="ink" x="530" y="128" font-size="13" font-weight="600">Make it your default browser</text>
    <text class="faint" x="530" y="146" font-size="11">so apps hand their links to NudgeJudge</text>

    <circle class="ring" cx="740" cy="88" r="14" stroke-width="3" stroke-dasharray="4 3"/>
    <text class="muted" x="740" y="93" font-size="13" font-weight="600">4</text>
    <text class="ink" x="740" y="128" font-size="13" font-weight="600">Add the browser extension</text>
    <text class="faint" x="740" y="146" font-size="11">optional: Settings → Browser extension,</text>
    <text class="faint" x="740" y="161" font-size="11">then install it in each browser</text>
  </g>

  <line class="rule" x1="28" y1="192" x2="852" y2="192" stroke-width="1"/>

  <!-- ============ Every link ============ -->
  <text class="ink" x="28" y="226" font-size="15" font-weight="600">Then, for every link</text>

  <!-- Source: an app -->
  <rect class="card" x="28" y="250" width="214" height="78" rx="10" stroke-width="1.5"/>
  <text class="faint" x="44" y="274" font-size="12">Clicked in an app</text>
  <text class="ink" x="44" y="296" font-size="15" font-weight="600">Slack, Teams, mail…</text>
  <text class="muted mono" x="44" y="315" font-size="11">acme.atlassian.net/…</text>

  <!-- Source: inside a browser, through the extension -->
  <rect class="card" x="28" y="364" width="214" height="104" rx="10" stroke-width="1.5"/>
  <text class="faint" x="44" y="388" font-size="12">Clicked inside a browser</text>
  <text class="ink" x="44" y="410" font-size="15" font-weight="600">Chrome, Edge, Firefox…</text>
  <text class="muted" x="44" y="432" font-size="11">Modifier-click, or right-click</text>
  <text class="muted" x="44" y="449" font-size="11">→ Open with NudgeJudge</text>

  <!-- App → NudgeJudge: the OS hands it over -->
  <line class="route" x1="242" y1="289" x2="414" y2="289" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRoute)"/>
  <text class="faint" x="256" y="279" font-size="11">the OS hands it over</text>

  <!-- Browser → extension → NudgeJudge -->
  <line class="route" x1="242" y1="416" x2="268" y2="416" stroke-width="4" stroke-linecap="round"/>
  <rect class="card" x="268" y="398" width="104" height="36" rx="8" stroke-width="1.5"/>
  <text class="ink" x="320" y="421" font-size="13" font-weight="600" text-anchor="middle">Extension</text>
  <line class="route" x1="372" y1="416" x2="414" y2="416" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRoute)"/>
  <text class="faint" x="320" y="452" font-size="11" text-anchor="middle">native messaging</text>

  <!-- NudgeJudge -->
  <rect class="panel" x="420" y="258" width="140" height="190" rx="10" stroke="#3A4C42" stroke-width="1"/>
  <text class="onPanel" x="490" y="340" font-size="15" font-weight="700" text-anchor="middle">NudgeJudge</text>
  <text class="onPanelMuted" x="490" y="362" font-size="11" text-anchor="middle">checks your rules</text>
  <text class="onPanelMuted" x="490" y="378" font-size="11" text-anchor="middle">top to bottom</text>

  <!-- Match → the rule's browser -->
  <line class="route" x1="560" y1="289" x2="680" y2="289" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRoute)"/>
  <text class="faint" x="574" y="279" font-size="11">a rule matches</text>
  <rect class="card" x="686" y="258" width="166" height="62" rx="10" stroke-width="1.5"/>
  <rect x="686" y="258" width="166" height="62" rx="10" fill="none" class="route" stroke-width="2"/>
  <rect class="routeFill" x="686" y="258" width="5" height="62" rx="2"/>
  <text class="ink" x="704" y="284" font-size="14" font-weight="600">Chrome Work</text>
  <text class="muted" x="704" y="303" font-size="11">opens in the rule's browser</text>

  <!-- No match → chooser -->
  <line class="track" x1="560" y1="416" x2="680" y2="416" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowTrack)"/>
  <text class="faint" x="574" y="406" font-size="11">no rule matches</text>
  <rect class="card" x="686" y="385" width="166" height="62" rx="10" stroke-width="1.5"/>
  <text class="ink" x="704" y="411" font-size="14" font-weight="600">Chooser asks</text>
  <text class="muted" x="704" y="430" font-size="11">press 1–9 to pick a browser</text>

  <!-- "Always" turns the choice into a rule -->
  <path class="route" d="M769 447 V 494 H 490 V 454" fill="none" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRoute)"/>
  <text class="muted" x="630" y="514" font-size="11" text-anchor="middle">pick “Always” and the choice becomes a rule</text>

  <text class="faint" x="28" y="500" font-size="11">If your rules pick the browser you're already in,</text>
  <text class="faint" x="28" y="516" font-size="11">the link simply opens there.</text>
</svg>
