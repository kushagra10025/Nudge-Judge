# Push a tag like v0.2.0 to build the native app for Windows and Linux, pack it with Velopack
# and publish both to one GitHub Release. Installed copies find it from Settings → Updates.
# The browser extension is built with the same version and attached to that release too.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  # Keep in step with the Velopack package version in Directory.Packages.props.
  VPK_VERSION: 1.2.161

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - run: dotnet test -c Release
      - run: dotnet publish NudgeJudge.Desktop -c Release -r win-x64 -p:Version=${{ env.VERSION }} -o publish
      # Fetches the previous release so this one can ship as a small delta. Nothing to fetch on the first release.
      - run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - run: >
          vpk pack --packId NudgeJudge --packVersion ${{ env.VERSION }} --packDir publish
          --mainExe NudgeJudge.Desktop.exe --packTitle NudgeJudge --packAuthors Kushagra
          --icon NudgeJudge/Assets/nudgejudge.ico
      - run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }} --releaseName "NudgeJudge ${{ env.VERSION }}" --merge --publish

  # After Windows, so the two jobs don't race to create the release; this one adds the Linux files to it.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Native AOT's linker prerequisites; usually on the image already, but don't depend on it.
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - run: dotnet publish NudgeJudge.Desktop -c Release -r linux-x64 -p:Version=${{ env.VERSION }} -o publish
      - run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - run: >
          vpk pack --packId NudgeJudge --packVersion ${{ env.VERSION }} --packDir publish
          --mainExe NudgeJudge.Desktop --packTitle NudgeJudge --packAuthors Kushagra
          --icon NudgeJudge/Assets/nudgejudge.png
      - run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }} --releaseName "NudgeJudge ${{ env.VERSION }}" --merge --publish

  # The browser extension ships with the app it talks to, as files on the same release. Never as a release of its
  # own: the app's updater reads this repository's releases and expects each to carry Velopack's feed.
  extension:
    needs: linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NudgeJudge.Extension
    env:
      # Optional. With these repository secrets (an AMO API key: addons.mozilla.org → Tools → Manage API Keys),
      # the Firefox build is signed by Mozilla as an unlisted add-on, which regular Firefox installs. Without them,
      # only an unsigned build is attached, which Firefox loads as a temporary add-on only.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which wrote package-lock.json. npm 10 (Node 22) reads its optional per-platform
          # packages (lightningcss, an optional peer of Vite) as required and fails with EBADPLATFORM.
          node-version: 24
          cache: npm
          cache-dependency-path: NudgeJudge.Extension/package-lock.json
      # Same version as the app, so every release can be signed (AMO never signs one version twice).
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run compile
      - run: npm test
      # Chromium: an unpacked build with the development key, so its ID is the one the app allows
      # (store builds get a store-assigned ID instead). Installed with "Load unpacked".
      - run: npm run build
      - run: cd .output/chrome-mv3 && zip -qr "../nudgejudge-extension-$VERSION-chromium.zip" .
      # Firefox: builds .output/firefox-mv3 and the sources zip AMO asks for.
      - run: npm run zip:firefox
      - name: Sign for Firefox (unlisted)
        if: env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@10 sign --channel unlisted
          --source-dir .output/firefox-mv3 --artifacts-dir .output/signed
          --upload-source-code ".output/nudgejudge-extension-$VERSION-sources.zip"
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          && mv .output/signed/*.xpi ".output/nudgejudge-extension-$VERSION-firefox.xpi"
      - name: Attach the unsigned Firefox build when it wasn't signed
        if: env.AMO_JWT_ISSUER == ''
        run: cp ".output/nudgejudge-extension-$VERSION-firefox.zip" ".output/nudgejudge-extension-$VERSION-firefox-unsigned.zip"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          ".output/nudgejudge-extension-$VERSION-chromium.zip"
          $(ls .output/nudgejudge-extension-$VERSION-firefox.xpi .output/nudgejudge-extension-$VERSION-firefox-unsigned.zip 2>/dev/null)
      # Store packages for later uploads, with this release's version: the Chromium one without the development key
      # (stores assign their own ID), the Firefox one with its sources. Kept as this run's artifact, not on the
      # release, where the keyless Chromium build would look installable but couldn't reach the app.
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: nudgejudge-extension-store-${{ env.VERSION }}
          path: |
            NudgeJudge.Extension/.output/nudgejudge-extension-*-chrome.zip
            NudgeJudge.Extension/.output/nudgejudge-extension-*-firefox.zip
            NudgeJudge.Extension/.output/nudgejudge-extension-*-sources.zip
