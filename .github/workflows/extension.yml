# Checks the browser extension (NudgeJudge.Extension/) on every change to it: type check, tests, and a build for
# Chromium browsers and Firefox. A check only: what ships is built by release.yml's `extension` job, with the
# release's version (the files users install, attached to the release, and the store packages, kept as that run's
# artifact). See docs/browser-extension.md#publishing.
name: Extension

on:
  push:
    branches: [main]
    paths: ["NudgeJudge.Extension/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["NudgeJudge.Extension/**", ".github/workflows/extension.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: NudgeJudge.Extension

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which wrote package-lock.json. npm 10 (Node 22) reads its optional per-platform
          # packages (lightningcss, an optional peer of Vite) as required and fails with EBADPLATFORM.
          node-version: 24
          cache: npm
          cache-dependency-path: NudgeJudge.Extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox

